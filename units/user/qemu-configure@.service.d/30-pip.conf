#
# configure installs the tree's own Python package into build/pyvenv
# with pip, which warns that it cannot write its cache: the unit holds
# the developer's home read-only. The install is from the tree and
# caches nothing.

[Service]
Environment=PIP_NO_CACHE_DIR=1
