#
# File what configure reported, as it exits (kernel-kconfig@.service.d
# has the how). krecord takes the target list from the file the task left
# in the build.

[Service]
StateDirectory=krecords
ExecStopPost=-env krecord --project qemu \
    --command "configure --target-list={configuration}" \
    --configuration-file build/.target-list \
    --priority warning --producer kdevops-ng \
    --producer-tree %h/.local/share/systemd/user/%p@.service.d
