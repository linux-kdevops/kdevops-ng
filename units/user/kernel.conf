#
# What every kernel task's unit takes, linked into each one's drop-in
# directory. The unit's instance is the tree, so it runs there, sees the
# tree and the developer's home read-only, and may write the tree's build/
# (designs/principles.md, 4).

[Service]
WorkingDirectory=%f
PrivateUsers=yes
ProtectHome=read-only
ReadOnlyPaths=%f
ReadWritePaths=%f/build
