#
# File what make reported, as make exits (kernel-kconfig@.service.d has
# the how).

[Service]
StateDirectory=krecords
ExecStopPost=-env krecord --project qemu --command make \
    --priority warning --producer kdevops-ng \
    --producer-tree %h/.local/share/systemd/user/%p@.service.d
