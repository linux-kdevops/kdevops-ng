#
# File what make reported, as make exits: kresults' krecord reads the
# unit's warnings from the journal and writes the record. env finds
# krecord on the unit's PATH, and the "-" has systemd ignore its exit
# status, so a host without krecord still configures. krecord takes the
# record's name and the variables to record from the command, the
# configuration's name from the file kconfig left in the build, and
# kdevops-ng's version from the checkout this directory is linked from.

[Service]
StateDirectory=krecords
ExecStopPost=-env krecord --command "make {configuration}" \
    --config build/.config --configuration-file build/.config.name \
    --priority warning --producer kdevops-ng \
    --producer-tree %h/.local/share/systemd/user/%p@.service.d
