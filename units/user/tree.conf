#
# What the unit of every task on a tree takes, linked into each one's
# drop-in directory. The unit's instance is the tree, so it runs there and
# sees the tree and the developer's home read-only
# (designs/principles.md, 4). What krecord prints goes under the unit's
# name, as the tool's lines do (tasks/common/unit).

[Service]
SyslogIdentifier=%n
WorkingDirectory=%f
PrivateUsers=yes
ProtectHome=read-only
ReadOnlyPaths=%f
