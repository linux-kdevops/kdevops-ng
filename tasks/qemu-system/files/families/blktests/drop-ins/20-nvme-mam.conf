# The first namespace of a blktests-* machine with NVMe's multiple
# atomicity mode: atomic writes of up to eight blocks, in normal
# operation and after a power failure, with and without a boundary.
# It needs a QEMU whose nvme-ns device has atomic.mam.
# tasks/qemu-system/drop-in gives it to a machine.

[QEMU]
set=device.ns0.atomic.nawun=7
set=device.ns0.atomic.nawupf=7
set=device.ns0.atomic.nabsn=7
set=device.ns0.atomic.nabspf=7
set=device.ns0.atomic.mam=on
