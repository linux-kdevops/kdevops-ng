# SPDX-License-Identifier: copyleft-next-0.3.1
# What every machine of a suite shares: a guest that runs the suite's
# tests on two NVMe namespaces (docs/tasks/blktests.rst). The family's
# own directory, NAME-.qemu.d, holds the share of the suite, and
# tasks/qemu-system/machine copies this file beside it. Both are copied
# to ~/.config/qemu/systemd once and left as they are found after. It
# runs as it is. What a series needs of its machines goes in files of
# its own: tasks/qemu-system/qemu gives a machine the QEMU a tree built,
# and tasks/qemu-system/drop-in a namespace's options. A file name
# without a directory is one of the machine's state directory, so each
# machine has its own disk and namespaces, and %i is its name.

[VM]
# The key root's ssh takes, which tasks/libguestfs/customize put in the
# guest: the unit powers the guest off with it.
SSHPrivateKey=%h/.ssh/guests

[Service]
# The namespaces start empty at each start of the machine: what a test
# wrote is of no use to the next, and a sparse file takes the room of
# what was written and no more.
ExecStartPre=rm --force nvme0.raw nvme1.raw
ExecStartPre=truncate --size=1G nvme0.raw nvme1.raw

[QEMU]
machine=q35
nodefaults=
accel=kvm
cpu=host
# The machines that run at once share the host's processors and
# memory.
# The debug options of the blktests profile take memory: with 2G the
# kernel kills a test of the block group for want of it.
m=4G
smp=2
nographic=
serial=mon:stdio
# The guest's disk, in its state directory.
drive=file=work.qcow2,if=virtio,format=qcow2
netdev=user,id=net0
device=virtio-net-pci-non-transitional,netdev=net0
device=nvme,serial=nvme0,id=nvme0,ioeventfd=on
# Nothing of a namespace outlasts the machine, so QEMU flushes none of
# it (cache=unsafe), and what the guest discards goes back to the host.
drive=file=nvme0.raw,if=none,format=raw,cache=unsafe,discard=unmap,detect-zeroes=unmap,id=nvme0-ns0
# A drop-in gives a namespace what a series tests, by the device's id,
# as set=device.ns0.zoned=true. tasks/qemu-system/files/drop-ins has
# those kept, and tasks/qemu-system/drop-in gives one to a machine.
device=nvme-ns,id=ns0,drive=nvme0-ns0,bus=nvme0,logical_block_size=4096,physical_block_size=4096
# A second namespace, with eight bytes of metadata for each block: a
# test of the metadata is not run on one without.
drive=file=nvme1.raw,if=none,format=raw,cache=unsafe,discard=unmap,detect-zeroes=unmap,id=nvme0-ns1
device=nvme-ns,id=ns1,drive=nvme0-ns1,bus=nvme0,ms=8,logical_block_size=4096,physical_block_size=4096

[virtiofsd]
shared-dir=%h
tag=home
sandbox=namespace
uid-map=:0:%U:1:
gid-map=:0:%G:1:

[Install]
WantedBy=machines.target
