# What a machine named fio-* has beside the machine of every suite
# (../../10-machine.conf): the share of fio's config and results, in the
# machine's state directory.

[virtiofsd]
shared-dir=%S/qemu-system/%i/fio
tag=fio
sandbox=namespace
uid-map=:0:%U:1:
gid-map=:0:%G:1:
